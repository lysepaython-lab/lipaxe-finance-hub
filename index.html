    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04aad6" />
    <title>Lipaxe — Borderless banking, built for trust</title>
    <meta name="description" content="Lipaxe is a secure fintech platform for deposits, withdrawals and international transfers. Move money with clarity and confidence." />

    <!-- Security hardening (defence-in-depth; primary controls live server-side) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=(), payment=(self), usb=()" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:title" content="Lipaxe — Borderless banking, built for trust" />
    <meta property="og:description" content="Send, receive and manage money across borders with bank-grade security." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

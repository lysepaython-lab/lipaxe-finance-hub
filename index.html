<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="512x512" href="/lipaxe-icon.png" />
    <link rel="apple-touch-icon" href="/lipaxe-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#01594B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#04261f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lipaxe" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Lipaxe — L’avenir des paiements en Afrique — Rapide, Sécurisé et Sans Frontières</title>
    <meta name="description" content="Lipaxe is a secure fintech platform for deposits, withdrawals and international transfers. Move money with clarity and confidence." />
    <meta name="author" content="Lipaxe" />

    <!-- Security hardening (defence-in-depth; primary controls live server-side) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=(), payment=(self), usb=()" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:title" content="Lipaxe — L’avenir des paiements en Afrique — Rapide, Sécurisé et Sans Frontières" />
    <meta property="og:description" content="Send, receive and manage money across borders with bank-grade security." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
